name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build stable (master) into dist/
        run: npm run build

      - name: Build preview branch into dist/next/
        run: |
          git fetch origin feature/dts-derived-types --depth=1
          git worktree add ../preview origin/feature/dts-derived-types
          cd ../preview
          npm ci
          BASE_PATH=/poracle-config/next/ npm run build
          cd -
          rm -rf dist/next
          cp -r ../preview/dist dist/next

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
