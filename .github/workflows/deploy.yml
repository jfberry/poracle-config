name: Deploy to GitHub Pages

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Standing integration branch built into the /next/ preview channel, mirroring
  # PoracleNG's develop -> main flow: work lands on `develop` (previewed at
  # /poracle-config/next/), then promotes to `master` (the stable root site).
  PREVIEW_BRANCH: develop

jobs:
  # Stable site — always built from master (pinned), so a develop-triggered run
  # rebuilds /next/ without ever clobbering the production root. Independent of
  # the preview build so a broken preview can never block the production deploy.
  build-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build stable site
        run: npm run build
      - name: Upload stable build
        uses: actions/upload-artifact@v7
        with:
          name: stable-dist
          path: dist

  # Preview site (/poracle-config/next/) from PREVIEW_BRANCH. continue-on-error
  # keeps a preview failure from failing the run; the deploy job tolerates a
  # missing preview artifact, so the stable site still ships.
  build-preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build preview site into /next/
        run: BASE_PATH=/poracle-config/next/ npm run build
      - name: Upload preview build
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist

  # Assemble dist/ (stable) + dist/next/ (preview, if available) and deploy.
  # Runs whenever the stable build succeeded, regardless of the preview result.
  deploy:
    needs: [build-stable, build-preview]
    if: ${{ !cancelled() && needs.build-stable.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stable build into dist/
        uses: actions/download-artifact@v8
        with:
          name: stable-dist
          path: dist
      # If build-preview failed, no preview-dist artifact exists: this step then
      # fails and shows a red ✗ in the UI, but continue-on-error tolerates it and
      # the stable-only site still deploys. A red ✗ here on a green run is expected.
      - name: Download preview build into dist/next/ (tolerated if preview build failed)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: preview-dist
          path: dist/next
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
